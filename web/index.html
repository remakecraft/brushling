<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <meta name="robots" content="noindex">
  <title>Brushling</title>
  <style>
    :root { color-scheme: light dark; --bg: #f8f8f8; --fg: #333; }
    @media (prefers-color-scheme: dark) { :root { --bg: #1b1b1b; --fg: #bbb; } }
    html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--fg); }
    canvas#brushling { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
    #status {
      position: fixed; inset: 0; display: grid; place-items: center; padding: 16px;
      font: 14px/1.5 system-ui, sans-serif; text-align: center; pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="brushling"></canvas>
  <div id="status">Loading Brushling…</div>
  <noscript><div style="padding:16px">Brushling needs JavaScript and WebAssembly.</div></noscript>
  <script>
    // Brushling's Ctrl shortcuts (Ctrl+R flip/rotate, Ctrl+E attributes, Ctrl+L
    // colour box, ...) win over the browser's where the browser lets a page
    // have them. Ctrl+C/X/V stay with the browser so clipboard events fire.
    addEventListener("keydown", (e) => {
      const k = e.key.toLowerCase();
      const app = /^[a-z]$/.test(k) ? !"cvx".includes(k) : ["+", "-", "=", "pageup", "pagedown"].includes(k);
      if ((e.ctrlKey || e.metaKey) && !e.altKey && app) e.preventDefault();
      if (e.key === "F1") e.preventDefault();
    }, { capture: true });
    // Set by the app while the image has unsaved changes.
    window.brushlingUnsaved = false;
    addEventListener("beforeunload", (e) => {
      if (window.brushlingUnsaved) e.preventDefault();
    });
  </script>
  <script type="module">
    // Relative URLs, so the build works from any sub-path.
    import init from "./brushling.js";
    init({ module_or_path: new URL("./brushling_bg.wasm", import.meta.url) }).catch((e) => {
      document.getElementById("status").textContent = "Brushling could not start: " + e;
    });
  </script>
</body>
</html>
